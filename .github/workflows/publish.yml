name: Publish pack to GitHub Pages
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
      - run: go install github.com/packwiz/packwiz@latest
      - name: Create index.toml and refresh packwiz
        run: |
          [ -f index.toml ] || touch index.toml
          packwiz refresh
      - name: Stage pack files
        run: |
          mkdir _site
          rsync -a --exclude='.git' --exclude='.github' --exclude='_site' \
            --exclude='*.sh' --exclude='*.py' --exclude='*.md' \
            --exclude='.env*' --exclude='*.zip' --exclude='*.mrpack' \
            ./ _site/
      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./_site
          publish_branch: gh-pages